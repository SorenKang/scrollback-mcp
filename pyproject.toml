[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrollback-mcp"
version = "0.2.0"
description = "Rebuild a source tree from a screen recording of an IDE — CLI and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "scrollback-mcp contributors" }]
keywords = ["mcp", "ocr", "video", "screen-recording", "intellij", "code-recovery", "pp-ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development",
]

dependencies = [
    "mcp>=1.2",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "rapidocr>=3.4",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
# Windows GPU via DirectML (no CUDA needed). Run `scrollback-mcp check --fix-gpu` after installing.
gpu = ["onnxruntime-directml"]
# YAML well-formedness check during verify
yaml = ["pyyaml"]
# tools/make_video.py (synthetic test recordings)
dev = ["pillow>=10"]

[project.scripts]
scrollback-mcp = "scrollback_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/SorenKang/scrollback-mcp"
Repository = "https://github.com/SorenKang/scrollback-mcp"
Issues = "https://github.com/SorenKang/scrollback-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scrollback_mcp"]
